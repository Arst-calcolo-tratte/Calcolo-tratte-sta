<style>
  :root{
    --navy:#0E3050;
    --navy-deep:#092136;
    --paper:#FBF7EF;
    --bg:#EEF1F0;
    --ink:#1F5D4C;
    --ink-soft:#e4efe9;
    --sand:#c9bfa9;
    --warn:#B3401A;
    --warn-soft:#faece4;
    --text:#16202B;
    --muted:#5c6772;
    --line:#dfe4e2;
    --radius-lg:20px;
    --radius-md:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column;position:relative}

  header{
    background:var(--navy);color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 26px;
    position:sticky;top:0;z-index:5;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(255,255,255,.06), transparent 55%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy) 100%);
    border-bottom:3px solid var(--ink);
  }
  .eyebrow{
    display:flex;align-items:center;gap:8px;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.11em;
    text-transform:uppercase;color:#a9c2d6;margin-bottom:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px rgba(31,93,76,.35)}
  h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  header .sub{margin-top:4px;font-size:13px;color:#c3d3e0}

  main{padding:16px 16px 40px;flex:1}

  .card{
    background:#fff;border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;
    box-shadow:0 1px 2px rgba(15,35,55,.04), 0 8px 24px -12px rgba(15,35,55,.12);
    border:1px solid var(--line);
  }

  label{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
  label .idx{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;border-radius:4px;background:var(--navy);color:#fff;
    font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  }

  .select-wrap{position:relative}
  select{
    width:100%;height:52px;border:1.5px solid var(--line);border-radius:var(--radius-md);
    padding:0 40px 0 14px;font-size:16px;font-weight:600;background:#fcfdfd;color:var(--text);
    appearance:none;-webkit-appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(14,48,80,.12)}
  .select-wrap::after{
    content:"";position:absolute;right:16px;top:50%;transform:translateY(-65%) rotate(45deg);
    width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    pointer-events:none;
  }
  .field{margin-top:14px}

  .buttons{display:flex;gap:10px;margin-top:16px}
  button{
    flex:1;border:0;border-radius:var(--radius-md);padding:14px 8px;font-size:14.5px;
    font-weight:800;letter-spacing:.02em;cursor:pointer;
    transition:transform .08s ease, filter .15s ease;
    font-family:'Inter',sans-serif;
  }
  button:active{transform:scale(.97)}
  button.main{background:var(--navy);color:#fff}
  button.main:hover{filter:brightness(1.08)}
  button.ghost{background:#eef2f4;color:var(--navy)}
  button.ghost:hover{background:#e4eaee}

  /* ---- Ticket result ---- */
  .ticket{
    position:relative;border-radius:var(--radius-lg);
    background:var(--paper);
    border:1px solid #ecdfc4;
    padding:22px 20px 18px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(15,35,55,.04), 0 10px 28px -14px rgba(15,35,55,.18);
  }
  .ticket::before,.ticket::after{
    content:"";position:absolute;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;background:var(--bg);
    box-shadow:0 0 0 1px #ecdfc4 inset;
  }
  .ticket::before{left:-13px}
  .ticket::after{right:-13px}

  .ticket-head{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:#8a7f63;margin-bottom:14px}

  .ticket-body{display:flex;align-items:stretch}
  .ticket-col{flex:1;text-align:center;padding:4px 6px}
  .ticket-divider{
    width:0;border-left:2px dashed #d8cba8;margin:0 14px;position:relative;
  }
  .ticket-divider::before,.ticket-divider::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    width:14px;height:14px;border-radius:50%;background:var(--bg);
    box-shadow:0 0 0 1px #ecdfc4 inset;
  }
  .ticket-divider::before{top:-24px}
  .ticket-divider::after{bottom:-20px}

  .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#8a7f63;
    font-weight:700;margin-bottom:6px}
  .tratta{font-family:'Space Mono',monospace;font-size:52px;font-weight:700;color:var(--navy);
    line-height:1;margin:2px 0}
  .price{font-family:'Space Mono',monospace;font-size:32px;font-weight:700;color:var(--ink);
    line-height:1;margin:2px 0}

  .route{
    margin-top:16px;padding-top:14px;border-top:1px dashed #d8cba8;
    display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--text);
  }
  .route .arrow{color:#a3966f;font-size:14px}

  .fascia-row{margin-top:10px;font-size:12.5px;color:#8a7f63}
  .fascia-row b{color:var(--text)}

  .msg{
    margin-top:14px;padding:12px 13px;border-radius:11px;font-size:13px;line-height:1.45;
    display:flex;gap:9px;align-items:flex-start;
  }
  .msg.info{background:#eaf1f7;color:#2c516f}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  .msg .ico{flex:0 0 auto;margin-top:1px}

  .placeholder{
    text-align:center;padding:30px 10px 8px;color:var(--muted);
  }
  .placeholder .big{font-family:'Space Mono',monospace;font-size:34px;color:#c7cfd4;margin-bottom:6px}
  .placeholder p{margin:0;font-size:13px}

  .urban-note{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy);color:#fff;border-radius:var(--radius-md);
    padding:14px 16px;font-size:13.5px;font-weight:600;
  }
  .urban-note .price-tag{font-family:'Space Mono',monospace;font-weight:700;font-size:16px;color:#bfe0d1}

  footer{
    text-align:center;padding:6px 20px 28px;font-size:11px;color:var(--muted);
    line-height:1.6;
  }
</style>
</head>

      <span class="price-tag">€ 1,50</span>

  </main>

  <footer>App non ufficiale per uso personale · dati desunti dal tariffario STA Iglesias</footer>
</div>

const F = document.getElementById("from"), A = document.getElementById("to");

function fillSelect(sel, selectedIndex){
  sel.innerHTML = STOPS.map((name,i)=>`<option value="${i}">${name}</option>`).join("");
  sel.value = selectedIndex;
}
fillSelect(F, 0);
fillSelect(A, 1);

function euro(n){
  return new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
}

// Cerca il valore in entrambi i versi prima di arrendersi: se la cella A→B non è
// leggibile ma B→A sì, il numero di tratta è comunque noto (la tariffa è la stessa
// in entrambe le direzioni).
function resolveTratta(i,j){
  const direct = MATRIX[i][j];
  if(direct != null) return {value:direct, inferred:false};
  const reverse = MATRIX[j][i];
  if(reverse != null) return {value:reverse, inferred:true};
  return {value:null, inferred:false};
}

function renderPlaceholder(text){
  ticketContent.innerHTML = `
    <div class="placeholder">
      <div class="big">— · —</div>
      <p>${text}</p>
    </div>`;
}

function renderSame(){
  renderPlaceholder("Partenza e arrivo coincidono: scegli due fermate diverse per calcolare la tratta.");
}

function renderUnreadable(routeLabel){
  ticketContent.innerHTML = `
    <div class="ticket-body">
      <div class="ticket-col">
        <div class="cap">Numero tratta</div>
        <div class="tratta mono" style="font-size:30px">Verificare</div>
      </div>
      <div class="ticket-divider"></div>
      <div class="ticket-col">
        <div class="cap">Tariffa</div>
        <div class="price mono">—</div>
      </div>
    </div>
    <div class="route"><span>${routeLabel[0]}</span><span class="arrow">→</span><span>${routeLabel[1]}</span></div>
    <div class="msg warn"><span class="ico">⚠️</span><span>Questo incrocio non è leggibile con certezza nella tabella originale, in nessuna delle due direzioni. Verifica la tariffa a bordo con l'operatore.</span></div>
  `;
}

function renderResult(x, inferred, routeLabel){
  const z = TARIFFS[x];
  ticketContent.innerHTML = `
    <div class="ticket-body">
      <div class="ticket-col">
        <div class="cap">Numero tratta</div>
        <div class="tratta mono">${x}</div>
      </div>
      <div class="ticket-divider"></div>
      <div class="ticket-col">
        <div class="cap">Tariffa a bordo</div>
        <div class="price mono">${z ? euro(z[1]) : "—"}</div>
      </div>
    </div>
    <div class="route"><span>${routeLabel[0]}</span><span class="arrow">→</span><span>${routeLabel[1]}</span></div>
    <div class="fascia-row">Fascia chilometrica: <b>${z ? z[0]+" km" : "—"}</b></div>
    ${inferred ? `<div class="msg info"><span class="ico">ℹ️</span><span>Tratta dedotta dal verso opposto (${routeLabel[1]} → ${routeLabel[0]}), non leggibile direttamente in tabella per questo verso.</span></div>` : ""}
  `;
}

function calc(){
  const i = Number(F.value), j = Number(A.value);
  const routeLabel = [STOPS[i], STOPS[j]];

  if(i === j){ renderSame(); return; }

  const {value, inferred} = resolveTratta(i,j);
  if(value == null){ renderUnreadable(routeLabel); return; }

  renderResult(value, inferred, routeLabel);
}

document.getElementById("calc").onclick = calc;
document.getElementById("swap").onclick = () => { const x = F.value; F.value = A.value; A.value = x; calc(); };
F.onchange = calc; A.onchange = calc;

ticketDate.textContent = new Date().toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
calc();
