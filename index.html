<style>
  :root{
    --blue:#243B70;
    --blue-deep:#182A52;
    --red:#D71920;
    --paper:#FFFFFF;
    --paper-edge:#DCE2EC;
    --bg:#F3F5F9;
    --ink:#182033;
    --muted:#667085;
    --line:#D9DFEA;
    --warn:#8A3A12;
    --warn-soft:#FFF1E8;
    --info-soft:#EAF0FA;
    --info-ink:#284B80;
    --radius-lg:20px;
    --radius-md:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'PT Serif',Georgia,'Times New Roman',serif}

  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column}

  header{
    background:linear-gradient(160deg,#1d3262 0%,#243B70 64%,#2d4a88 100%);color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 14px;
    position:sticky;top:0;z-index:5;overflow:hidden;
    border-bottom:4px solid var(--red);
    box-shadow:0 5px 18px rgba(24,42,82,.16);
  }
  header::after{
    content:"";position:absolute;right:-54px;bottom:-34px;width:180px;height:82px;
    border-top:12px solid rgba(255,255,255,.10);transform:skewX(-22deg);pointer-events:none;
  }
  .brand{
    position:relative;z-index:1;display:flex;justify-content:center;align-items:center;
    min-height:104px;margin-bottom:7px;padding:8px 14px;
    background:#fff;border-radius:0 0 34px 34px;
  }
  .brand img{display:block;width:min(100%,390px);height:auto;max-height:96px;object-fit:contain}
  .eyebrow{
    position:relative;z-index:1;display:flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:#D9E1F0;margin-bottom:5px;font-weight:700;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.18)}
  h1{position:relative;z-index:1;margin:0;font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.1;font-family:'Inter',sans-serif}
  header .sub{position:relative;z-index:1;margin-top:5px;font-size:13px;color:#E1E7F2}

  main{padding:18px 16px 38px;flex:1}

  .card{
    position:relative;background:#fff;border-radius:var(--radius-lg);padding:19px;margin-bottom:16px;
    box-shadow:0 2px 4px rgba(24,42,82,.04),0 12px 28px -16px rgba(24,42,82,.25);
    border:1px solid var(--line);overflow:hidden;
  }
  .card::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--blue) 0 38%,var(--red) 38% 62%,var(--blue) 62% 100%)}

  label{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;
    text-transform:uppercase;letter-spacing:.075em;color:var(--blue);margin-bottom:8px}
  label .idx{
    display:inline-flex;align-items:center;justify-content:center;
    width:21px;height:21px;border-radius:6px;background:var(--blue);color:#fff;
    font-size:10px;font-weight:800;font-family:'Inter',sans-serif;box-shadow:0 2px 4px rgba(36,59,112,.18)
  }

  .select-wrap{position:relative}
  select{
    width:100%;height:54px;border:1.5px solid #CDD5E2;border-radius:var(--radius-md);
    padding:0 42px 0 15px;font-size:16px;font-weight:700;background:#FBFCFE;color:var(--ink);
    appearance:none;-webkit-appearance:none;font-family:'Inter',sans-serif;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(36,59,112,.13)}
  .select-wrap::after{
    content:"";position:absolute;right:17px;top:50%;transform:translateY(-65%) rotate(45deg);
    width:8px;height:8px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);pointer-events:none;
  }
  .field{margin-top:14px}

  .buttons{display:flex;gap:10px;margin-top:17px}
  button{
    flex:1;border:0;border-radius:var(--radius-md);padding:14px 8px;font-size:14.5px;
    font-weight:800;letter-spacing:.015em;cursor:pointer;font-family:'Inter',sans-serif;
    transition:transform .08s ease,filter .15s ease,background .15s ease;box-shadow:0 3px 9px rgba(24,42,82,.10)
  }
  button:active{transform:scale(.97)}
  button.main{background:var(--blue);color:#fff}
  button.main:hover{filter:brightness(1.08)}
  button.ghost{background:#EEF1F6;color:var(--blue-deep);box-shadow:none}
  button.ghost:hover{background:#E3E8F1}

  /* ---- Biglietto ---- */
  .ticket{
    position:relative;border-radius:var(--radius-lg);background:var(--paper);
    border:1px solid var(--paper-edge);padding:22px 20px 19px;overflow:hidden;
    box-shadow:0 2px 5px rgba(24,42,82,.05),0 16px 34px -18px rgba(24,42,82,.26);
  }
  .ticket::before,.ticket::after{
    content:"";position:absolute;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px var(--paper-edge) inset;
  }
  .ticket::before{left:-12px}.ticket::after{right:-12px}
  .ticket::marker{display:none}
  .ticket::selection{background:rgba(36,59,112,.15)}
  .ticket > .t-eyebrow::after{
    content:"";display:block;width:92px;height:4px;margin:10px auto 0;
    background:linear-gradient(90deg,var(--blue) 0 35%,var(--red) 35% 65%,var(--blue) 65% 100%);
    transform:skewX(-18deg);border-radius:1px;
  }
  .t-eyebrow{text-align:center;font-size:10.5px;letter-spacing:.11em;font-weight:800;color:var(--blue);text-transform:uppercase;line-height:1.45}
  .t-title{text-align:center;font-size:25px;font-weight:700;margin:8px 0 9px;letter-spacing:.01em;color:var(--ink)}
  .t-caption{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:15px;padding-bottom:13px;border-bottom:1px dashed #D6DCE7}
  .t-caption b{color:var(--ink)}
  .t-body{position:relative;padding:6px 0 4px;min-height:150px}
  .watermark{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:150px;height:auto;opacity:.08;pointer-events:none}
  .t-row{position:relative;z-index:1;display:flex;align-items:baseline;gap:8px;font-size:16px;margin-bottom:6px;color:var(--blue-deep)}
  .t-row .num{font-weight:800;font-size:20px;color:var(--red)}
  .t-price-wrap{position:relative;z-index:1;text-align:center;margin:13px 0 11px}
  .t-price-old{font-size:16px;color:#98A1B2;text-decoration:line-through;margin-right:8px}
  .t-price{font-size:46px;font-weight:800;color:var(--blue-deep);letter-spacing:-.025em}
  .t-discount{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--blue-deep);background:var(--info-soft);border:1px solid #D5E0F1;border-radius:8px;padding:6px 10px;margin:0 auto 4px;display:inline-block;font-weight:700}
  .t-discount-wrap{text-align:center;margin-bottom:8px}
  .t-route{position:relative;z-index:1;text-align:center;font-size:15px;font-weight:800;margin-top:4px;color:var(--ink)}
  .t-route .arrow{color:var(--red);padding:0 7px;font-weight:800}
  .t-footer{text-align:center;margin-top:16px;padding-top:12px;border-top:1px dashed #D6DCE7;font-size:11px;color:var(--muted);letter-spacing:.02em;line-height:1.7}
  .t-footer span{display:block}
  .placeholder{text-align:center;padding:26px 10px 6px;color:var(--muted)}
  .placeholder .big{font-size:15px;margin-bottom:4px}.placeholder p{margin:0;font-size:13px;line-height:1.5}
  .msg{position:relative;z-index:1;margin-top:12px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}.msg .ico{flex:0 0 auto;margin-top:1px}
  .urban-note{
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;
    background:var(--blue);color:#fff;border-radius:var(--radius-md);padding:14px 16px;font-size:13.5px;font-weight:700;
    box-shadow:0 5px 14px rgba(24,42,82,.14);border-left:5px solid var(--red);
  }
  .urban-note::after{content:"";position:absolute;right:-35px;bottom:-30px;width:100px;height:55px;border-top:7px solid rgba(255,255,255,.12);transform:skewX(-20deg)}
  .urban-note .price-tag{position:relative;z-index:1;font-weight:800;font-size:17px;color:#E3EAF5}
  footer{text-align:center;padding:6px 20px 28px;font-size:11px;color:var(--muted);line-height:1.6}

  @media (max-width:380px){
    header{padding-left:15px;padding-right:15px}.brand img{width:100%;max-width:340px}.card{padding:17px}.ticket{padding-left:17px;padding-right:17px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img src="./sta-50-logo.png" alt="STA · 50 anni · Muoviamo la Sardegna"></div>
    <div class="eyebrow"><span class="dot"></span>STA IGLESIAS · AGE08 · AGG. 03/08/2023</div>
    <h1>Calcolo tratta</h1>
    <div class="sub">Seleziona partenza e arrivo per la tariffa a bordo</div>
  </header>

  <main>
    <section class="card">
      <label for="from"><span class="idx">A</span>Partenza</label>
      <div class="select-wrap"><select id="from"></select></div>

      <div class="field">
        <label for="to"><span class="idx">B</span>Arrivo</label>
        <div class="select-wrap"><select id="to"></select></div>
      </div>

      <div class="buttons">
        <button class="main" id="calc">Calcola tratta</button>
        <button class="ghost" id="swap">↕ Inverti</button>
      </div>
    </section>

    <section class="ticket" id="ticket">
      <div class="t-eyebrow">Servizio automobilistico</div>
      <div id="ticket-content"></div>
      <div class="t-footer" id="ticket-footer"></div>
    </section>

    <section class="urban-note">
      <span>Tariffa urbana</span>
      <span class="price-tag">€ 1,50</span>
    </section>
  </main>

  <footer>App non ufficiale per uso personale · dati desunti dal tariffario STA Iglesias</footer>
</div>

const TARIFFS={1:["0–10",2.30],2:["10–20",2.90],3:["20–30",3.50],4:["30–40",4.10],5:["40–50",4.70],6:["50–60",5.30],7:["60–70",5.90],8:["70–80",6.50],9:["80–90",7.10],10:["90–100",7.70],11:["100–125",9.10],12:["125–150",10.50],13:["150–175",12.00],14:["175–200",13.50],15:["200–225",15.00],16:["225–250",16.50],17:["250–275",17.50],18:["275–300",19.00],19:["300–325",20.50],20:["325–350",22.00]};

const F = document.getElementById("from"), A = document.getElementById("to");
const ticketContent = document.getElementById("ticket-content");
const ticketFooter = document.getElementById("ticket-footer");

function fillSelect(sel, selectedIndex){
  sel.innerHTML = STOPS.map((name,i)=>`<option value="${i}">${name}</option>`).join("");
  sel.value = selectedIndex;
}
fillSelect(F, 0);
fillSelect(A, 1);

function euro(n){
  return "€ " + n.toFixed(2).replace(".", ",");
}

// Cerca il valore in entrambi i versi prima di arrendersi: se la cella A→B non è
// leggibile ma B→A sì, il numero di tratta è comunque noto (la tariffa è la stessa
// in entrambe le direzioni).
function resolveTratta(i,j){
  const direct = MATRIX[i][j];
  if(direct != null) return {value:direct, inferred:false};
  const reverse = MATRIX[j][i];
  if(reverse != null) return {value:reverse, inferred:true};
  return {value:null, inferred:false};
}

function serial(i,j){
  let n = String(1000*i + j);
  while(n.length < 6) n = "0" + n;
  return "AT" + n;
}

function pad2(n){ return n < 10 ? "0" + n : String(n); }
function todayStr(){
  const d = new Date();
  return pad2(d.getDate()) + "/" + pad2(d.getMonth()+1) + "/" + d.getFullYear();
}

function renderPlaceholder(text){
  ticketContent.innerHTML = `<div class="placeholder"><p>${text}</p></div>`;
  ticketFooter.innerHTML = "";
}

function renderUnreadable(routeLabel){
  ticketContent.innerHTML = `
    <div class="t-route serif">${routeLabel[0]}<span class="arrow">→</span>${routeLabel[1]}</div>
    <div class="msg warn"><span class="ico">⚠️</span><span>Questo incrocio non è leggibile con certezza nella tabella originale, in nessuna delle due direzioni. Verifica la tariffa a bordo con l'operatore.</span></div>
  `;
  ticketFooter.innerHTML = "";
}

function renderResult(x, inferred, i, j, routeLabel){
  const z = TARIFFS[x];
  const base = z ? z[1] : null;
  const exempt = EXEMPT_ORIGINS.has(i);
  const finalPrice = (base != null && exempt) ? Math.max(base - DISCOUNT, 0) : base;

  ticketContent.innerHTML = `
    <div class="t-body">
      <svg class="watermark" viewBox="0 0 200 120"><use href="#bus-icon"/></svg>
      <div class="t-row serif"><span>Tratta Tariffaria</span><span class="num">${x}</span></div>
      <div class="t-price-wrap serif">
        ${exempt && base != null ? `<span class="t-price-old">${euro(base)}</span>` : ""}
        <span class="t-price">${finalPrice != null ? euro(finalPrice) : "—"}</span>
      </div>
      ${exempt ? `<div class="t-discount-wrap"><span class="t-discount">− ${euro(DISCOUNT)} · nessuna sovrattassa da ${routeLabel[0]}</span></div>` : ""}
      <div class="t-route serif">${routeLabel[0]}<span class="arrow">→</span>${routeLabel[1]}</div>
      ${inferred ? `<div class="msg warn" style="background:var(--info-soft);color:var(--info-ink)"><span class="ico">ℹ️</span><span>Tratta dedotta dal verso opposto (${routeLabel[1]} → ${routeLabel[0]}), non leggibile direttamente in tabella per questo verso.</span></div>` : ""}
    </div>
  `;
  ticketFooter.innerHTML = `<span>N. ${serial(i,j)}</span><span>${todayStr()}</span>`;
}

function calc(){
  const i = Number(F.value), j = Number(A.value);
  const routeLabel = [STOPS[i], STOPS[j]];

  if(i === j){
    renderPlaceholder("Partenza e arrivo coincidono: scegli due fermate diverse per calcolare la tratta.");
    return;
  }

  const {value, inferred} = resolveTratta(i,j);
  if(value == null){ renderUnreadable(routeLabel); return; }

  renderResult(value, inferred, i, j, routeLabel);
}

document.getElementById("calc").onclick = calc;
document.getElementById("swap").onclick = () => { const x = F.value; F.value = A.value; A.value = x; calc(); };
F.onchange = calc; A.onchange = calc;

calc();
