function calc(){const i=Number(F.value),j=Number(A.value),x=MATRIX[i][j];route.textContent=F.options[F.selectedIndex].text+" → "+A.options[A.selectedIndex].text;warn.style.display="none";
if(i===j){tratta.textContent="—";price.textContent="—";fascia.textContent="—";return}
if(x==null){tratta.textContent="VERIFICARE";price.textContent="—";fascia.textContent="—";warn.textContent="Incrocio non leggibile con certezza nella tabella originale.";warn.style.display="block";return}
const z=TARIFFS[String(x)];tratta.textContent=x;fascia.textContent=z?z[0]+" km":"—";price.textContent=z?euro(z[1]):"—";}
document.getElementById("calc").onclick=calc;document.getElementById("swap").onclick=()=>{let x=F.value;F.value=A.value;A.value=x;calc()};F.onchange=calc;A.onchange=calc;calc();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));}</script>
